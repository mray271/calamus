name: CI Images

# Rebuilds pre-baked distro images and pushes them to ghcr.io.
# Triggered only when a Dockerfile or this workflow changes — not on every PR.
# compat.yml and selinux.yml pull these images instead of installing packages
# from scratch on every run.

on:
  push:
    branches: ["**"]
    paths:
      - "build-aux/ci/**"
      - ".github/workflows/ci-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: calamus-ci-fedora-44
            dockerfile: build-aux/ci/Dockerfile.fedora-44
          - image: calamus-ci-ubuntu-25.04
            dockerfile: build-aux/ci/Dockerfile.ubuntu-25.04
          - image: calamus-ci-debian-13
            dockerfile: build-aux/ci/Dockerfile.debian-13
          - image: calamus-ci-opensuse-tumbleweed
            dockerfile: build-aux/ci/Dockerfile.opensuse-tumbleweed

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          # Registry-backed BuildKit cache so repeated image builds skip
          # unchanged layers without needing a local Docker cache.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
